name: Example5_Booking
options:
  bundleIdPrefix: com.ivan.lab8
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Example5_Booking:
    type: application
    platform: iOS
    sources:
      - path: Example5_Booking
    settings:
      base:
        INFOPLIST_FILE: Example5_Booking/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ivan.lab8.Example5_Booking
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_ENABLE_OBJC_ARC: YES
    info:
      path: Example5_Booking/Info.plist
    dependencies:
      - sdk: MapKit.framework
      - sdk: CoreData.framework
    preBuildScripts:
      - name: "Generate CoreData"
        script: ""
