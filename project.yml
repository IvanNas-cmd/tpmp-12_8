  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Task2-2_BSU_Map:
    type: application
    platform: iOS
    sources:
      - path: Task2-2_BSU_Map
    settings:
      base:
        INFOPLIST_FILE: Task2-2_BSU_Map/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ivan.lab8.Task2-2
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Task2-2_BSU_Map/Info.plist
    dependencies:
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreData.framework
